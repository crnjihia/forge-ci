# path: web/nginx.conf

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to backend Go service
    location /runs {
        proxy_pass http://api:8080/runs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Disable buffering for Server-Sent Events (SSE) log streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /secrets {
        proxy_pass http://api:8080/secrets;
        proxy_set_header Host $host;
    }

    location /billing {
        proxy_pass http://api:8080/billing;
        proxy_set_header Host $host;
    }

    location /webhooks {
        proxy_pass http://api:8080/webhooks;
        proxy_set_header Host $host;
    }

    location /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_set_header Host $host;
    }
}

