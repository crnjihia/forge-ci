# path: .github/workflows/ci.yml
name: Forge CI - Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Build & Test (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests
        run: go test -v -race -timeout 5m ./...

  frontend-test:
    name: Frontend Build & Test (Vite / React)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test & Build Frontend
        working-directory: ./web
        if: hashFiles('web/package.json') != ''
        run: |
          npm ci || npm install
          npm run test --if-present
          npm run build --if-present

