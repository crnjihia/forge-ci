# path: deployments/k8s/04-redis.yaml
apiVersion: v1
kind: Service
metadata:
  name: forge-redis
  namespace: forge-ci
  labels:
    app.kubernetes.io/name: forge-ci
    app.kubernetes.io/component: redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: forge-redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: forge-ci
  labels:
    app.kubernetes.io/name: forge-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-redis
  namespace: forge-ci
  labels:
    app.kubernetes.io/name: forge-redis
    app.kubernetes.io/part-of: forge-ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-redis
        app.kubernetes.io/part-of: forge-ci
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              if [ -n "$$REDIS_PASSWORD" ]; then
                redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
              else
                redis-server --appendonly yes;
              fi
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forge-secrets
                  key: REDIS_PASSWORD
                  optional: true
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  if [ -n "$$REDIS_PASSWORD" ]; then
                    redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG;
                  else
                    redis-cli ping | grep PONG;
                  fi
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  if [ -n "$$REDIS_PASSWORD" ]; then
                    redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG;
                  else
                    redis-cli ping | grep PONG;
                  fi
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc

