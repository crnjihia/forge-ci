# path: deployments/k8s/02-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: forge-secrets
  namespace: forge-ci
  labels:
    app.kubernetes.io/name: forge-ci
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # 32-byte hexadecimal key for AES-256-GCM encrypted secrets vault
  FORGE_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  # PostgreSQL Credentials
  POSTGRES_USER: "forge_admin"
  POSTGRES_PASSWORD: "change_me_to_strong_db_password"
  POSTGRES_URL: "postgres://forge_admin:change_me_to_strong_db_password@forge-postgres:5432/forge_ci?sslmode=disable"

  # Redis Credentials
  REDIS_PASSWORD: "change_me_to_strong_redis_password"
  REDIS_URL: "redis://:change_me_to_strong_redis_password@forge-redis:6379/0"

  # MinIO S3 Object Storage Credentials
  MINIO_ROOT_USER: "forge_minio_admin"
  MINIO_ROOT_PASSWORD: "change_me_to_strong_minio_password"
  MINIO_ACCESS_KEY: "forge_minio_admin"
  MINIO_SECRET_KEY: "change_me_to_strong_minio_password"

  # Safaricom Daraja M-Pesa STK Push Credentials
  DARAJA_CONSUMER_KEY: "daraja_consumer_key_placeholder"
  DARAJA_CONSUMER_SECRET: "daraja_consumer_secret_placeholder"
  DARAJA_PASSKEY: "daraja_passkey_placeholder"
  DARAJA_CALLBACK_URL: "https://ci.example.co.ke/billing/mpesa/callback"

  # Africa's Talking Bilingual SMS Gateway
  AT_API_KEY: "africas_talking_api_key_placeholder"

  # GitHub Integration & Webhook HMAC Verification
  GITHUB_TOKEN: "ghp_placeholder_github_token"
  GITHUB_WEBHOOK_SECRET: "forge_github_webhook_hmac_secret_token"

