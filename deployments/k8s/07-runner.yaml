# path: deployments/k8s/07-runner.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: forge-runner
  namespace: forge-ci
  labels:
    app.kubernetes.io/name: forge-runner
    app.kubernetes.io/part-of: forge-ci
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-runner
        app.kubernetes.io/part-of: forge-ci
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: runner
          image: ghcr.io/crnjihia/forge-ci/forge-runner:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
          envFrom:
            - configMapRef:
                name: forge-config
            - secretRef:
                name: forge-secrets
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4096Mi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket

